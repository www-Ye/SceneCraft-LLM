# SceneCraft Default Configuration

# Scene generation settings
scene:
  table:
    width: 1.0      # meters
    depth: 0.7      # meters  
    height: 0.75    # meters
  
  physics:
    timestep: 0.002
    gravity: [0, 0, -9.81]
    settle_steps: 2000
    velocity_clamp: 2.0

# Rendering settings
render:
  width: 1920
  height: 1440
  quality: "high"
  
  # Camera views to render
  views:
    - "perspective"
    - "front" 
    - "topdown"
    - "closeup"

# Asset settings
assets:
  stl_directory: "data/assets/_mujoco_stl"
  catalog_file: "data/tabletop_asset_catalog.json"
  
  # Mesh processing
  preserve_geometry: true  # Don't use convex hull for visual meshes
  separate_collision: true # Use separate collision meshes

# Output settings
output:
  base_directory: "outputs"
  save_xml: true
  save_config: true
  save_images: true

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(levelname)s - %(message)s"